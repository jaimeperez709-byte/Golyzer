name: Actualizar datos de Golyzer

on:
  schedule:
    # 9:00am hora de Colombia (UTC-5) = 14:00 UTC, todos los días
    - cron: "0 14 * * *"
  workflow_dispatch: {}  # permite correrlo a mano desde la pestaña "Actions" en GitHub

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Correr el script de actualización
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python3 refresh_data.py

      - name: Publicar los cambios (si hay)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualización automática de datos de Golyzer"
          file_pattern: "predictor-app-prototipo.html pickstats-app/www/index.html predictions_log.json"
